name: CI
on:
  pull_request:
  push:
    branches:
      - main
  schedule:
  - cron: '00 01 * * *'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.6' # LTS
          - '1' # Latest Release
          - 'nightly'
        os:
          - ubuntu-latest
          - macOS-latest
          - windows-latest
        arch:
          - x86
          - x64
        exclude:
          # macOS runners are Apple Silicon, so they get aarch64 below instead
          - os: macOS-latest
            arch: x86
          - os: macOS-latest
            arch: x64
        include:
          - version: '1'
            os: macOS-latest
            arch: aarch64
          - version: 'nightly'
            os: macOS-latest
            arch: aarch64
          # Julia 1.6 has no aarch64 macOS build, so run x64 under Rosetta
          - version: '1.6'
            os: macOS-latest
            arch: x64
            force-arch: true
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
          force-arch: ${{ matrix.force-arch == true }}
      - uses: actions/cache@v5
        env:
          cache-name: cache-artifacts
        with:
          path: ~/.julia/artifacts
          key: ${{ runner.os }}-test-${{ env.cache-name }}-${{ hashFiles('**/Project.toml') }}
          restore-keys: |
            ${{ runner.os }}-test-${{ env.cache-name }}-
            ${{ runner.os }}-test-
            ${{ runner.os }}-
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
